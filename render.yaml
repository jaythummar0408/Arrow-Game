# Render Blueprint — deploys the APMC API as a FREE web service.
#
# Usage: Render dashboard → New → Blueprint → pick this repo.
# Values marked `sync: false` are secrets you enter in the Render dashboard;
# they are never committed to git.
#
# NOTE: In-process cron is OFF here (ENABLE_AUTO_SYNC=false) because a free
# Render service sleeps when idle, so node-cron can't run reliably. The
# scheduled jobs run in GitHub Actions instead — see DEPLOY_FREE.md.
services:
  - type: web
    name: apmc-backend
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENABLE_AUTO_SYNC
        value: "false"
      - key: DB_NAME
        value: APMC
      - key: API_VERSION
        value: v1
      - key: DATA_GOV_BASE_URL
        value: https://api.data.gov.in/resource
      - key: MONGO_URI_PROD
        sync: false
      - key: MONGO_URI_DEV
        sync: false
      - key: DATA_GOV_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: NEWSDATA_API_KEY
        sync: false
